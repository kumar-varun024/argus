[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Autonomous Offensive Security Platform"
requires-python = ">=3.11"

dependencies = [
    "typer>=0.16",
    "rich>=14.0",
    "loguru>=0.7",
    "networkx>=3.5",
    "pydantic>=2.8",
    "pyyaml>=6.0.1",
    "msgpack>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.2",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.2",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0"
]

[project.scripts]
argus = "argus.cli.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["argus*"]
# Do not ship test modules inside the installed package. This also prevents
# in-package test files (e.g. argus/plugins/graphql/tests/test_graphql.py)
# from colliding with tests/ during collection.
exclude = ["*.tests", "*.tests.*", "argus.*.tests", "argus.*.tests.*"]

[tool.pytest.ini_options]
# Only collect the top-level test suite, and use importlib import mode so that
# duplicate test-file basenames across directories do not raise
# "import file mismatch" collection errors.
testpaths = ["tests"]
addopts = "--import-mode=importlib"
